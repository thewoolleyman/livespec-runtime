# pyproject.toml — livespec-runtime.
#
# Authority for every rule expressed here is the live specification at
# livespec/SPECIFICATION/ (notably non-functional-requirements.md
# §"Toolchain pins", §"Shared content provenance", §"Linter rule set",
# §"Typechecker rule set", §"Code coverage thresholds") plus this
# library's own SPECIFICATION/ tree once seeded at Phase G.3 of epic
# li-fgqgnk.
#
# This file is HAND-AUTHORED (not generated from copier). The epic
# YAGNI'd templates/library/ until a second library variant appears;
# when it does, a future propose-change cycle MAY extract this file's
# common shape into a templates/library/pyproject.toml.jinja.
#
# Has a [build-system] section: livespec-runtime IS installable
# (consumed by every livespec-governed repo via uv git source per
# livespec/SPECIFICATION/contracts.md §"Shared code sync —
# livespec-runtime").

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "livespec-runtime"
version = "0.18.1"
description = "Shared runtime library for livespec-governed projects: cross-repo dependency resolution, retry policy, runtime types consumed by canonical livespec skills and impl-plugin consumers. Sibling to livespec, livespec-impl-*, and livespec-dev-tooling (which owns enforcement-suite code)."
requires-python = ">=3.10.16"
authors = [
    { name = "Chad Woolley", email = "thewoolleyman@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"

# Runtime dependencies at v0.2.0 (li-aclzfe impl):
#
# - `typing_extensions` is needed for `typing_extensions.assert_never`
#   under the >=3.10.16 floor (`typing.assert_never` is 3.11+). Used by
#   `livespec_runtime.cross_repo.resolve` to enforce exhaustivity of
#   the `DependsOnEntry` match.
#
# - `dry-python/returns` supplies the ROP railway primitives (`Result`,
#   `IOResult`, `@safe`, `@impure_safe`) that livespec
#   `non-functional-requirements.md` §"Shared content provenance"
#   requires of every governed repo carrying first-party Python.
#
#   IT IS DECLARED HERE AND IMPORTED BARE, WITH NO `_vendor/` TREE, AND
#   THAT IS THE RATIFIED SHAPE FOR THIS REPO RATHER THAN AN OMISSION.
#   This package is consumed TWO ways at once: installed as a wheel, AND
#   source-copied verbatim into three consumers' `.claude-plugin/scripts/
#   _vendor/livespec_runtime/` trees. Per livespec v191, a source-copied
#   library MUST declare the dependency (serving the installed path) and
#   MUST import it bare, so that on the source-copied path it resolves
#   against the CONSUMING repo's own `_vendor/` root — all three
#   consumers already vendor `returns`. Vendoring it here instead would
#   nest `_vendor` inside `_vendor`, putting two copies of one library on
#   one `sys.path` under two independent manifests. `typing_extensions`
#   above already occupies this exact shape.
#
# - `gh` CLI is a SYSTEM dependency, not a Python package. Invoked via
#   subprocess from `livespec_runtime.cross_repo.providers.github`.
#   Consumers MUST install `gh` and run `gh auth status` successfully
#   before invoking the cross-repo resolve walk.
#
# - Retry policy is hand-rolled (no tenacity), kept in
#   `livespec_runtime.cross_repo.retry` for zero transitive pin cost
#   on consumers.
dependencies = [
    "returns>=0.25.0",
    "typing_extensions>=4.4.0",
]

# The `git credential` helper entry point (github_auth): installing this
# library places the script on the consumer venv's PATH; consumers wire it
# as `git config credential.helper '!livespec-github-credential-helper'`.
[project.scripts]
livespec-github-credential-helper = "livespec_runtime.github_auth.credential_helper:run"
livespec-hygiene-scan = "livespec_runtime.hygiene_scan:run"

[tool.hatch.build.targets.wheel]
packages = ["livespec_runtime"]

[dependency-groups]
# Every Python dev tool is uv-managed via this table (resolved into
# uv.lock; installed into a project-local .venv via
# `uv sync --all-groups`). Mise pins only the non-Python binaries
# in .mise.toml. Versions mirror livespec-core's pins exactly per
# livespec/SPECIFICATION/non-functional-requirements.md
# §"Shared content provenance".
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "hypothesis==6.122.3",
    "hypothesis-jsonschema==0.23.1",
    "mutmut==3.2.3",
    "import-linter==2.1",
    "livespec-dev-tooling",
]

# livespec-dev-tooling is consumed from the github.com sibling-library
# repo via uv git source per
# livespec/SPECIFICATION/contracts.md §"Shared code sync —
# livespec-dev-tooling". The library's semver-stable surface is the
# `python -m livespec_dev_tooling.checks.<slug>` invocation set (each
# slug's argv contract and exit-code semantics). Bump-pin PRs against
# this repo land each new tag per livespec/SPECIFICATION/contracts.md
# §"Cross-repo coordination — pin-and-bump". v0.5.0 flips the
# primary-checkout invariant from `core.bare = true` to the
# commit-refuse hook installed at .git/hooks/pre-commit and
# .git/hooks/pre-push; the new check slug
# `primary_checkout_commit_refuse_hook_installed` replaces
# `primary_checkout_bare_flag_set` in the canonical aggregate
# (epic li-unbare Phase 3, work-item li-unbarrun). v0.9.0 adds the
# two canonical checks `skill_invocation_paths` and
# `tool_backed_check_completeness`, and activates the
# require-granular-scenarios + scenario-tier rule in
# `heading_coverage` (epic li-scetier; the `scenario_tiers` allowlist
# below + the `tests/heading-coverage.json` scenario entries land in
# the same PR, work-item li-scetrn).
[tool.uv.sources]
livespec-dev-tooling = { git = "https://github.com/thewoolleyman/livespec-dev-tooling.git", tag = "v1.21.1" }

# Consumer-declared layout config consumed by the shared
# livespec-dev-tooling checks (per livespec-dev-tooling
# SPECIFICATION/contracts.md §"Consumer configuration schema"). EVERY role
# key MUST be DECLARED, and all ten are declared below. An undeclared key
# that a wired check consumes is a hard ERROR naming the key and its legal
# spellings. Omission is NOT an opt-out — selective declaration was the
# PRE-v0.54.12 regime, retired by livespec-dev-tooling epic
# livespec-dev-tooling-e9j slice L.
#
# HOW A ROLE THIS REPO LACKS IS DECLARED (livespec-dev-tooling-8o8e.1). The
# five UNION keys — `pure_trees`, `target_dirs`, `source_tree_prefixes`,
# `dataclasses_tree`, `neutral_hook_body_path` — are the ones whose value IS
# a check's scan universe, so an empty value made that check scan NOTHING
# and exit 0. `[]` / `""` there meant two incompatible things at once, and
# this repo is the proof: emptying `source_tree_prefixes` to decline the
# tests-mirror convention ALSO silently disarmed the commit-time TDD pairing
# gate, which no comment here ever mentioned. Each of the five now carries a
# real value or exactly ONE blessed variant (`not_applicable`,
# `superseded_by`, `unarmed_until`, `convention_not_adopted`), with its
# reason in the PARSED VALUE rather than in a comment no checker can read. A
# bare `[]` / `""` on those five parses to `LegacyAmbiguousEmpty` and WARNs
# today, and becomes a hard `ConfigParseError` once the fleet has migrated.
#
# Every OTHER role key keeps a bare `[]` as a LEGITIMATE spelling. Those are
# exemption / severity predicates whose consuming checks derive the universe
# from `resolve_check_universe()`, so an empty value makes them STRICTER
# rather than blinder.
#
# `scenario_tiers` is the node-id-prefix allowlist the `heading_coverage`
# check (v0.9.0+) accepts as integration-tier-or-above for
# `SPECIFICATION/scenarios.md` headings. Runtime's scenarios are
# exercised by the consumer-style top-of-pyramid tier under
# `tests/consumer/` (node-id prefix `tests.consumer`); `tests.e2e` is
# listed for forward room should an e2e tier be added.
[tool.livespec_dev_tooling]
# Phase-2 file_lloc FLIP (fleet-check-coverage epic livespec-i5ebqd, track
# livespec-8x7d). With this key true, `file_lloc` hard-gates this repo's WHOLE
# git-derived first-party-.py universe (>250 LLOC => error/exit 1) instead of
# WARN-only. Safe to arm: the Phase-1 burndown brought every runtime .py under
# the ceiling (verified: `check-file-lloc` exits 0 with the gate armed, zero
# files >250); a 201-250 file still WARNs (soft band), a >250 file fails. This
# is a SEVERITY increase, never a bypass (per livespec .ai/ci-gate-discipline.md
# and the fleet-check-coverage golden rules). Requires livespec-dev-tooling >=
# v0.39.0 (the flip lever; this repo is pinned at v0.39.0 above).
file_lloc_hard_gate = true
plan_lifecycle_anchor = true
scenario_tiers = ["tests.consumer", "tests.e2e"]

# e9j Wave-1 B-rt (role-key declaration). `source_trees` arms the ROP checks
# (`no_except_outside_io`, `no_raise_outside_io`) over `livespec_runtime` for
# the first time. `io_trees` covers the `cross_repo` resolution substrate: the
# broad `except` in `cross_repo/retry.py` is SPEC-SANCTIONED — this repo's
# SPECIFICATION/constraints.md §"Provider constraints" requires provider domain
# errors to be `ValueError` subclasses "so the retry layer's broad catch still
# works", and §"Resolution-substrate constraints" mandates degrade-to-`UNKNOWN`.
# So the catch is exempted as the I/O seam it is, NOT narrowed (narrowing would
# break that ratified contract). The remaining roles declare their absence
# EXPLICITLY below, and — since `8o8e.1` — they say WHICH KIND of absence
# rather than sharing one indistinguishable `[]`. Runtime is a flat consumer
# with no separate command/pure/dataclasses/covered trees and installs no
# neutral shared hook body (`not_applicable`); it separately adopts neither the
# per-directory-CLAUDE.md (`target_dirs`) nor the tests-mirror-pairing
# (`source_tree_prefixes`) convention, because declaring real values there would
# redden `claude_md_coverage` / `tests_mirror_pairing` (`convention_not_adopted`).
# Those are two different statements and they now parse to two different types.
source_trees = ["livespec_runtime"]
io_trees = ["livespec_runtime/cross_repo"]
commands_trees = []
# The PreToolUse guard hook is a supervisor entry artifact: its `main()` carries
# the ONE fail-open boundary catch livespec non-functional-requirements.md line
# 114 grants a hook, and the file owns the hook-protocol stdout contract that
# `no_write_direct` otherwise bans. Listing it here is what makes both
# exemptions legible, and it also exempts its `sys.exit` from
# `check-supervisor-discipline`. It is deliberately NOT in `io_trees`: the same
# clause forecloses exempting a hook tree wholesale ("There is NO 'thin repo'
# exemption").
supervisor_entry_files = [".claude/hooks/livespec_footgun_guard.py"]
# NOT APPLICABLE — runtime is a flat consumer with no separate dataclasses/schema
# or pure parse/validate subtree, and it installs no neutral shared hook body.
# The concept does not exist here; there is nothing for these gates to scan.
dataclasses_tree = { not_applicable = "flat consumer with no separate dataclasses/schema tree" }
pure_trees = { not_applicable = "flat consumer with no separate pure parse/validate tree" }
neutral_hook_body_path = { not_applicable = "runtime is not a Driver and installs no neutral shared hook body" }
# CONVENTION NOT ADOPTED — materially different from not-applicable, and the
# distinction is why the union has four spellings. Both concepts DO apply to a
# repo shaped like this one; declaring real values would arm `claude_md_coverage`
# and `tests_mirror_pairing`, two structural conventions this repo has
# deliberately not adopted. Saying `not_applicable` here would be a lie that
# reads tidier.
target_dirs = { convention_not_adopted = "per-directory-CLAUDE.md convention not adopted; real values would redden claude_md_coverage" }
source_tree_prefixes = { convention_not_adopted = "tests-mirror-pairing convention not adopted; real values would redden tests_mirror_pairing" }
# `covered_trees` stays a bare `[]`, and that is CORRECT rather than an oversight:
# it is an exemption/severity predicate whose consuming checks derive the universe
# from `resolve_check_universe()`, so empty makes them STRICTER, never blinder.
covered_trees = []
# livespec v178 / livespec-dev-tooling SPECIFICATION v036: functions this repo
# defines that ANOTHER fleet member consumes across a repo boundary. A
# repo-local oracle structurally cannot see a sibling's import, so this key is
# the declared stand-in for a measurement no checkout can take.
#
# TIGHTENING-ONLY: every entry ADDS a name to the Result-return rule's scope,
# and an omission removes nothing the repo-local oracle already sees. So the
# STRICT end of this key is a FULL list, and an empty one is the blind end —
# which is what this repo had until now.
#
# MEASURED, NOT ASSERTED — and taken from the CENTRAL vantage rather than from
# here. `livespec-dev-tooling`'s fleet consumption row read all nine members'
# master tarballs (0 skipped, 0 unparsed) and initially found ELEVEN functions
# this repo defines and siblings import across 23 sites, against a declaration
# that named NOTHING. Filed as `livespec-dev-tooling-nkkv`; the record with
# every consumption site is `plan/rop-railway-enforcement/5cai-fleet-measurement.md`
# in that repo.
#
# ALL ORIGINAL ELEVEN ARE v178 CLAUSE-1 PRODUCT IMPORTS, not test imports: the
# consumers are `store.py`, `_ids.py`, `bin/_bootstrap.py` and `commands/*.py`
# in two orchestrators and, for `parse_cross_repo_manifest`, in `livespec`
# itself. The blast radius of ever converting one is the
# `livespec-dev-tooling-dx8l` shape exactly — dual-shape consumer wiring lands
# FIRST, in the consuming repo, and the signature change only after. Declaring
# a name here does NOT convert it; it makes the rule able to see it.
#
# A later central fleet run found THREE more v178 clause-1 product imports from
# `livespec` after spec-governance defaults moved into this runtime package.
# Each entry below names the consuming member and file individually; the related
# guard reading is recorded on work-item `livespec-runtime-0u8`.
cross_repo_public_api = [
    { file = "livespec_runtime/credentials.py", function = "decide_credentials", reason = "product import: livespec-orchestrator-beads-fabro's .claude-plugin/scripts/bin/_bootstrap.py" },
    { file = "livespec_runtime/credentials.py", function = "wrapper_launch_failure", reason = "product import: livespec-orchestrator-beads-fabro's .claude-plugin/scripts/bin/_bootstrap.py" },
    { file = "livespec_runtime/cross_repo/types.py", function = "parse_cross_repo_manifest", reason = "product import by THREE members: livespec-orchestrator-beads-fabro's commands/_cross_repo.py, livespec-orchestrator-git-jsonl's io/_cross_repo.py, and livespec's parse/cross_repo.py" },
    { file = "livespec_runtime/spec_governance.py", function = "documented_defaults", reason = "product import: livespec's .claude-plugin/scripts/livespec/spec_governance/default_block.py" },
    { file = "livespec_runtime/spec_governance.py", function = "manifest_rows", reason = "product import by livespec's .claude-plugin/scripts/livespec/spec_governance/registry.py and dev-tooling/checks/spec_governance_manifest.py" },
    { file = "livespec_runtime/spec_governance.py", function = "verify_default_block", reason = "product import by livespec's .claude-plugin/scripts/livespec/spec_governance/default_block.py and dev-tooling/checks/spec_governance_template.py" },
    { file = "livespec_runtime/work_items/lifecycle.py", function = "is_item_ready", reason = "product import: livespec-orchestrator-beads-fabro's _dispatcher_loop_selection.py, list_work_items.py and next.py" },
    { file = "livespec_runtime/work_items/lifecycle.py", function = "lane_of", reason = "product import: livespec-orchestrator-beads-fabro's _needs_attention_work_items.py and list_work_items.py, and livespec-orchestrator-git-jsonl's commands/attention_impl.py" },
    { file = "livespec_runtime/work_items/rank.py", function = "key_between", reason = "product import: livespec-orchestrator-beads-fabro's _orchestrator_gap_capture.py and groom.py, and livespec-orchestrator-git-jsonl's migration/beads_to_jsonl.py" },
    { file = "livespec_runtime/work_items/rank.py", function = "n_keys_between", reason = "product import: livespec-orchestrator-beads-fabro's commands/rebalance_ranks.py, plus two of its test modules" },
    { file = "livespec_runtime/work_items/reduce.py", function = "materialize_work_items", reason = "product import: both orchestrators' store.py" },
    { file = "livespec_runtime/work_items/reduce.py", function = "random_id_suffix", reason = "product import: both orchestrators' _ids.py" },
    { file = "livespec_runtime/work_items/reduce.py", function = "reduce_work_item_heads", reason = "product import: livespec-orchestrator-git-jsonl's store.py" },
    { file = "livespec_runtime/work_items/reduce.py", function = "work_item_record_identity", reason = "product import: livespec-orchestrator-git-jsonl's store.py" },
]

# ---------------------------------------------------------------------------
# Ruff — sole linter, formatter, import-sorter, complexity checker.
# Rule set mirrors livespec/pyproject.toml [tool.ruff] per
# livespec/SPECIFICATION/non-functional-requirements.md §"Linter rule set".
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
# `.claude/hooks/**` USED to sit here, on the ground that hook scripts are
# fail-open boundary code whose blind catches and direct prints are the
# contract. The premise was right and the remedy was wrong: excluding the tree
# took the BLE001 backstop down with it, and `check-no-except-outside-io` treats
# an inspected-but-ruff-excluded file as an error precisely because the position
# rule alone is half the pair. The hook now carries a marked sole boundary catch
# and writes via `sys.stdout.write`, so it needs no exclusion at all — only the
# narrow `PLR0911` waiver below.
extend-exclude = ["**/_vendor/**", "**/__pycache__/**", "mutants/**"]

[tool.ruff.lint]
# 27 categories: v011 baseline (11) + v012 additions (16). Per
# livespec/SPECIFICATION/non-functional-requirements.md §"Linter rule set".
select = [
    # ----- v011 baseline (11 categories) -----
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C90",   # mccabe complexity
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    # ----- v012 additions (16 categories) -----
    "TRY",   # tryceratops — pairs with K10 domain-vs-bugs split
    "FBT",   # flake8-boolean-trap — reinforces K4 keyword-only discipline
    "PIE",   # flake8-pie — miscellaneous anti-patterns
    "SLF",   # flake8-self — bans cross-class _-prefixed access
    "LOG",   # flake8-logging — logging discipline
    "G",     # flake8-logging-format — kwargs-only in log calls
    "TID",   # flake8-tidy-imports — no relative imports + banned-imports
    "ERA",   # eradicate — bans commented-out code (LLM artifact)
    "ARG",   # flake8-unused-arguments
    "RSE",   # flake8-raise — `raise X` over `raise X()`; raise...from discipline
    "PT",    # flake8-pytest-style
    "FURB",  # refurb — modern-Python refactor hints
    "SLOT",  # flake8-slots
    "ISC",   # flake8-implicit-str-concat — complements pyright
    "T20",   # flake8-print — bans print/pprint
    "S",     # flake8-bandit — security anti-patterns
    "BLE",   # flake8-blind-except — the ruff-side breadth backstop the armed
             # no_except_outside_io check requires over every inspected file
]
ignore = [
    "ISC001",  # implicit-str-concat on one line; conflicts with the formatter
]

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-branches = 10
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC" = { msg = "use typing.Protocol" }
"abc.ABCMeta" = { msg = "use typing.Protocol" }
"abc.abstractmethod" = { msg = "use typing.Protocol" }
"pickle" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }
"marshal" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }
"shelve" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }

[tool.ruff.lint.per-file-ignores]
# The PreToolUse guard hook, replacing the wholesale `.claude/hooks/**`
# exclusion removed above so BLE001 stays LIVE over it and its sole fail-open
# boundary marker is a real directive rather than a dead one. `PLR0911` alone is
# waived: `_check_segment` returns early once per footgun pattern, and
# collapsing those branches would reshape behavior-critical guard logic that has
# no test coverage. Same disposition as livespec-driver-claude's `C901` waiver
# on `no_shadow_ledger.py`.
".claude/hooks/livespec_footgun_guard.py" = ["PLR0911"]
# pytest conventions: bare assert, magic literals in assertions,
# subprocess.run with fixed argv lists, composite assertions,
# /tmp paths, token-suffixed variable names, long descriptive
# docstrings, many-arg pytest fixtures. Mirrors livespec-core's
# tests/ per-file-ignore set.
"tests/**.py" = [
    "S101", "PLR2004", "S603", "S607", "PT018", "S108", "S105", "TRY003", "E501", "PLR0913",
]
# Cross-repo modules will shell out to `gh` and `git` via subprocess.run
# with fixed argv lists per the providers.github contract; S603/S607/S404
# are over-strict for this documented pattern.
"livespec_runtime/cross_repo/**.py" = ["S603", "S607", "S404"]
# retry.py's broad `except Exception` is the spec-sanctioned I/O/retry-seam
# catch (SPECIFICATION/constraints.md §"Provider constraints": domain errors are
# ValueError subclasses "so the retry layer's broad catch still works"). io_trees
# exempts it from no_except_outside_io (position); this ignores the paired ruff
# BLE001 (breadth) for the same one sanctioned catch — scoped to retry.py so a
# future broad catch elsewhere in cross_repo still surfaces.
"livespec_runtime/cross_repo/retry.py" = ["BLE001"]
# The github_auth signer shells out to `openssl` via subprocess.run with a
# fixed argv list (the RS256 production signer); same documented pattern as
# cross_repo above.
"livespec_runtime/github_auth/**.py" = ["S603", "S607", "S404"]
"livespec_runtime/hygiene_scan*.py" = ["S603", "S607", "S404"]

# ---------------------------------------------------------------------------
# Pyright — strict + seven strict-plus diagnostics. Per
# livespec/SPECIFICATION/non-functional-requirements.md §"Typechecker rule set".
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["livespec_runtime"]
exclude = ["**/_vendor/**", "**/__pycache__/**", "livespec_runtime/work_items/_fractional_indexing.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

reportUnusedCallResult = "error"
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportImplicitStringConcatenation = "error"

# ---------------------------------------------------------------------------
# Pytest — pytest-cov + pytest-icdiff wiring.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    # `--import-mode=importlib` lets paired tests share a basename
    # across mirror trees without pytest's legacy `prepend` mode
    # triggering same-basename module collisions.
    "--import-mode=importlib",
]

# ---------------------------------------------------------------------------
# Coverage — 100% line + branch (per livespec/SPECIFICATION/
# non-functional-requirements.md §"Code coverage thresholds").
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
# Coverage uses an `omit`-only blocklist (no `source` allowlist).
# Subprocess-driven tests (in particular the cross_repo provider tests
# that spawn `gh`/`git` children) require pytest-cov's pth-installed
# startup hook to instrument the children; a relative `source` list
# resolves against the subprocess's cwd, so dropping `source` entirely
# lets every imported module be measured, then the `omit` patterns
# below filter out everything that isn't first-party livespec-runtime
# code. Same approach as livespec-core and livespec-dev-tooling.
omit = [
    "*/_vendor/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/__pycache__/*",
    "/tmp/*",
    "/private/var/folders/*",
    "mutants/*",
    # Verbatim CC0 third-party port (decision 38, G-1) — carried
    # source-only in the first-party tree (no `_vendor/` machinery in
    # livespec_runtime), excluded from the type/coverage gates like any
    # vendored code. Exercised through the `rank.py` wrapper, which IS
    # covered. NOTE: it is NO LONGER ruff-excluded (e9j Wave-1 B-rt) — the
    # armed `no_except_outside_io` requires ruff BLE coverage over every
    # file it inspects, and this port is already ruff-clean, so it is
    # lint-included while staying type/coverage-excluded.
    "*/work_items/_fractional_indexing.py",
]

[tool.coverage.report]
# 100% line + branch — livespec-runtime starts with the empty
# cross_repo skeleton (li-ufvfmb) so the threshold is trivially
# met at v0.1.0; subsequent releases adding modules MUST keep it
# at 100 per the same discipline as livespec-core.
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise ImportError",
    "@overload",
    # Main guard — never executed via pytest; covered by the meta-
    # test pattern where applicable.
    "if __name__ == .__main__.:",
    # Vendored-path guard — `if str(X) not in sys.path: sys.path.insert(...)`.
    # Already in sys.path when tests run via pyproject.toml `pythonpath`
    # config; the sys.path.insert branch is structurally dead in tests.
    # Matches the livespec-core exclusion pattern.
    "sys.path.insert",
    # `case _:` arms are structurally unreachable by spec mandate:
    # every `match` statement terminates with `case _: assert_never(...)`.
    # The arm is therefore unreachable when the subject's declared
    # type is exhaustively handled by the prior arms.
    "case _:",
]
